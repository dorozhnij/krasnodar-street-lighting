          const res = await fetch(url.toString(), { headers: src.headers || {} });
          let data = await res.json();
          if (data && data.features && typeof explodeMultiPoint === "function" &&
              data.features.some(f => f.geometry && f.geometry.type === "MultiPoint"))
            data = await new Promise(r => explodeMultiPoint(data, r));
          return { type: "geojson", data };
        }
        if (src.type === "file" && src.path) {
          try {
            const res = await fetch(src.path);
            let data = await res.json();
            if (data && data.features && typeof explodeMultiPoint === "function" &&
                data.features.some(f => f.geometry && f.geometry.type === "MultiPoint"))
              data = await new Promise(r => explodeMultiPoint(data, r));
            return { type: "geojson", data };
          } catch (e) {
            console.warn("Could not load file source " + sourceId + ": " + e.message);
            return null;
          }
        }
        return null;
      }

      // Feature state utilities (require promoteId on the source)
      window.llmapsClearFeatureStates = function(sourceId) {
        const map = window.llmaps_map;
        if (!map || !map.getSource(sourceId)) return;
        map.removeFeatureState({ source: sourceId });
      };
      window.llmapsSetFeatureState = function(sourceId, featureId, state) {
        const map = window.llmaps_map;
        if (!map || !map.getSource(sourceId)) return;
        map.setFeatureState({ source: sourceId, id: featureId }, state);
      };

      // Feature-state animation utilities (single shared RAF loop)
      window._llmapsFeatureStateAnims = window._llmapsFeatureStateAnims || {};
      window._llmapsFeatureStateAnimRaf = window._llmapsFeatureStateAnimRaf || null;

      function _llmapsAnimKey(sourceId, featureId, sourceLayer) {
        return String(sourceId) + "::" + String(sourceLayer || "") + "::" + String(featureId);
      }

      function _llmapsAnimEase(name, t) {
        if (name === "linear") return t;
        // default: easeInOutSine
        return -(Math.cos(Math.PI * t) - 1) / 2;
      }

      function _llmapsRunFeatureStateAnimLoop(ts) {
        var map = window.llmaps_map;
        var store = window._llmapsFeatureStateAnims || {};
        var keys = Object.keys(store);
        if (!map || keys.length === 0) {
          window._llmapsFeatureStateAnimRaf = null;
          return;
        }

        for (var i = 0; i < keys.length; i++) {
          var key = keys[i];
          var anim = store[key];
          if (!anim) continue;
          if (!map.getSource(anim.sourceId)) {
            delete store[key];
            continue;
          }

          var elapsed = Math.max(0, ts - anim.startTs);
          var progress = anim.duration <= 0 ? 1 : Math.min(1, elapsed / anim.duration);
          var eased = _llmapsAnimEase(anim.easing, progress);
          var frameState = {};

          for (var sKey in anim.targetState) {
            if (!Object.prototype.hasOwnProperty.call(anim.targetState, sKey)) continue;
            var targetVal = anim.targetState[sKey];
            var startVal = anim.startState[sKey];
            if (typeof targetVal === "number" && typeof startVal === "number" && isFinite(targetVal) && isFinite(startVal)) {
              frameState[sKey] = startVal + (targetVal - startVal) * eased;
            } else {
              frameState[sKey] = targetVal;
            }
          }

          // For fade-out patterns keep active=true during transition
          if (
            Object.prototype.hasOwnProperty.call(anim.targetState, "active") &&
            anim.targetState.active === false &&
            typeof anim.targetState.fade_mix === "number" &&
            progress < 1
          ) {
            frameState.active = true;
          }

          var featureSelector = { source: anim.sourceId, id: anim.featureId };
          if (anim.sourceLayer) featureSelector.sourceLayer = anim.sourceLayer;
          try {
            map.setFeatureState(featureSelector, frameState);
          } catch (e) {
            delete store[key];
            continue;
          }

          if (progress >= 1) {
            try {
              map.setFeatureState(featureSelector, anim.targetState);
            } catch (e2) {}
            delete store[key];
          }
        }

        if (Object.keys(store).length > 0) {
          window._llmapsFeatureStateAnimRaf = requestAnimationFrame(_llmapsRunFeatureStateAnimLoop);
        } else {
          window._llmapsFeatureStateAnimRaf = null;
        }
      }

      /**
       * Animate feature-state for one feature.
       *
       * @param {string} sourceId
       * @param {string|number} featureId
       * @param {Object} targetState - final state object
       * @param {Object} options - { duration?: number, easing?: "linear"|"easeInOutSine", sourceLayer?: string }
       */
      window.llmapsAnimateFeatureState = function(sourceId, featureId, targetState, options) {
        var map = window.llmaps_map;
        if (!map || !map.getSource(sourceId)) return;
        if (featureId == null || !targetState || typeof targetState !== "object") return;

        var opts = options || {};
        var duration = Number(opts.duration);
        if (!isFinite(duration) || duration < 0) duration = 220;
        var easing = (opts.easing === "linear" || opts.easing === "easeInOutSine") ? opts.easing : "easeInOutSine";
        var sourceLayer = opts.sourceLayer || null;

        var featureSelector = { source: sourceId, id: featureId };
        if (sourceLayer) featureSelector.sourceLayer = sourceLayer;
        var startStateRaw = {};
        try {
          startStateRaw = map.getFeatureState(featureSelector) || {};
        } catch (e) {
          startStateRaw = {};
        }

        var startState = {};
        for (var sKey in targetState) {
          if (!Object.prototype.hasOwnProperty.call(targetState, sKey)) continue;
          var targetVal = targetState[sKey];
          var currentVal = startStateRaw[sKey];
          if (typeof targetVal === "number" && isFinite(targetVal)) {
            if (typeof currentVal === "number" && isFinite(currentVal)) {
              startState[sKey] = currentVal;
            } else if (sKey === "fade_mix" && typeof startStateRaw.active === "boolean") {
              startState[sKey] = startStateRaw.active ? 1 : 0;
            } else {
              startState[sKey] = targetVal;
            }
          } else {
            startState[sKey] = currentVal;
          }
        }

        if (duration <= 0) {
          map.setFeatureState(featureSelector, targetState);
          return;
        }

        var animKey = _llmapsAnimKey(sourceId, featureId, sourceLayer);
        window._llmapsFeatureStateAnims[animKey] = {
          sourceId: sourceId,
          sourceLayer: sourceLayer,
          featureId: featureId,
          startTs: performance.now(),
          duration: duration,
          easing: easing,
          startState: startState,
          targetState: targetState
        };

        if (window._llmapsFeatureStateAnimRaf == null) {
          window._llmapsFeatureStateAnimRaf = requestAnimationFrame(_llmapsRunFeatureStateAnimLoop);
        }
      };

      /**
       * Public utility: retrieve GeoJSON data for a source.
       * Works with embedded (+ compressed) and remote sources.
       * Returns a Promise resolving to a GeoJSON object or null.
       *
       * Usage: const data = await window.llmapsGetSourceData("my-source");
       */
      window.llmapsGetSourceData = function(sourceId) {
        const config = readConfig();
        const embedded = config.embedded_sources || {};
        return getGeoJsonSource(config, sourceId, embedded).then(function(geo) {
          return geo && geo.data ? geo.data : null;
        });
      };

      // Store parsed GeoJSON data per source for feature-state binding
      window._llmapsSourceGeoJson = window._llmapsSourceGeoJson || {};

      function addSourceFromConfig(map, config, sourceId, embeddedSources) {
        const src = config.sources && config.sources[sourceId];
        if (!src || map.getSource(sourceId)) return Promise.resolve();
        if (src.type === "vector") {
          try {
            const vectorOpts = { type: "vector", tiles: src.tiles || [src.tiles_url] };
            if (src.promoteId) vectorOpts.promoteId = src.promoteId;
            map.addSource(sourceId, vectorOpts);
          } catch (e) {
            if (e.message && e.message.includes("already exists")) {
              console.warn(`Source ${sourceId} already exists, skipping`);
              return Promise.resolve();
            }
            throw e;
          }
          return Promise.resolve();
        }
        return getGeoJsonSource(config, sourceId, embeddedSources).then(geo => {
          if (geo) {
            if (src.promoteId) geo.promoteId = src.promoteId;
            // Keep a reference to parsed GeoJSON for feature-state binding
            if (geo.data) window._llmapsSourceGeoJson[sourceId] = geo.data;
            try {
              map.addSource(sourceId, geo);
            } catch (e) {
              if (e.message && e.message.includes("already exists")) {
                console.warn(`Source ${sourceId} already exists, skipping`);
                return;
              }
              throw e;
            }
          }
        });
      }

      function initVisibilityOptimization(maps, sourceIds) {
        const list = Array.isArray(maps) ? maps : [maps];
        const ids = sourceIds && sourceIds.length ? sourceIds : ['settlements'];
        document.addEventListener("visibilitychange", async () => {
          if (document.hidden) {
            list.forEach(map => {
              if (!map || !map._layersLoaded) return;
              map.stop();
              ids.forEach(sourceId => {
                if (!map.getSource(sourceId)) return;
                const style = map.getStyle();
                if (style && style.layers) {
                  style.layers
                    .filter(layer => layer.source === sourceId)
                    .forEach(layer => {
                      try {
                        if (map.getLayer(layer.id)) map.removeLayer(layer.id);
                      } catch (e) {}
                    });
                }
                try { map.removeSource(sourceId); } catch (e) {}
              });
              map.getCanvas().style.display = "none";
              map._layersLoaded = false;
            });
          } else {
            list.forEach(async map => {
              if (!map || map._layersLoaded) { if (map) { map.getCanvas().style.display = "block"; map.resize(); map.triggerRepaint(); } return; }
              map.getCanvas().style.display = "block";
              // Verify that sources are actually removed before reloading
              const allRemoved = ids.every(sourceId => !map.getSource(sourceId));
              if (allRemoved && map._loadLayers) {
                await map._loadLayers();
              }
              map._layersLoaded = true;
              map.resize();
              map.triggerRepaint();
            });
          }
        });
      }

      function loadLayers(map, config, embeddedSources, layerIdsFilter) {
        const layers = config.layers || [];
        const sourceIds = new Set(layers.map(l => l.source));
        const embedded = config.embedded_sources || embeddedSources || {};
        return Promise.all(
          Array.from(sourceIds).map(id =>
            addSourceFromConfig(map, config, id, embedded)
          )
        ).then(() => {
          layers.forEach(l => addLayerFromConfig(map, l, layerIdsFilter));
        });
      }

      function addLayerFromConfig(map, layerConfig, layerIdsToAdd) {
        if (layerIdsToAdd && !layerIdsToAdd.includes(layerConfig.id)) return;
        if (map.getLayer(layerConfig.id)) return;
        const layer = {
          id: layerConfig.id,
          type: layerConfig.type || "circle",
          source: layerConfig.source,
          paint: layerConfig.paint || {},
          layout: layerConfig.layout || {}
        };
        if (layerConfig["source-layer"] != null)
          layer["source-layer"] = layerConfig["source-layer"];
        if (layerConfig.visible === false) {
          layer.layout.visibility = "none";
        }
        if (layerConfig.minzoom != null) layer.minzoom = layerConfig.minzoom;
        if (layerConfig.maxzoom != null) layer.maxzoom = layerConfig.maxzoom;
        if (layerConfig.filter != null) layer.filter = layerConfig.filter;
        map.addLayer(layer);
      }

      // Event queue for llmapsOnLayersReady callbacks
      window._llmapsReadyCallbacks = window._llmapsReadyCallbacks || [];
      window._llmapsLayersReady = false;
      window._llmapsReadyMap = null;
      window.llmapsOnLayersReady = function(fn) {
        if (typeof fn === 'function') {
          window._llmapsReadyCallbacks.push(fn);
          // If layers already loaded, call immediately
          if (window._llmapsLayersReady && window._llmapsReadyMap) {
            fn(window._llmapsReadyMap);
          }
        }
      };

      /**
       * Apply feature-state bindings declared in layer configs.
       * For each layer with a ``featureState`` dict, iterates over the
       * source GeoJSON features and calls ``map.setFeatureState``.
       *
       * String values in the dict are treated as GeoJSON property names;
       * all other values (bool, number) are used as constants.
       */
      function applyFeatureStates(map, config) {
        var layers = config.layers || [];
        var sources = config.sources || {};
        layers.forEach(function(lc) {
          if (!lc.featureState) return;
          var sourceId = lc.source;
          var srcConfig = sources[sourceId];
          var promoteId = srcConfig && srcConfig.promoteId;
          var geojson = window._llmapsSourceGeoJson && window._llmapsSourceGeoJson[sourceId];
          if (!geojson || !geojson.features) {
            console.warn("applyFeatureStates: no GeoJSON data for source '" + sourceId + "'");
            return;
          }
          var bindings = lc.featureState;
          var count = 0;
          geojson.features.forEach(function(f) {
            var id = promoteId ? f.properties[promoteId] : f.id;
            if (id == null) return;
            var state = {};
            for (var key in bindings) {
              var val = bindings[key];
              state[key] = (typeof val === "string") ? f.properties[val] : val;
            }
            map.setFeatureState({ source: sourceId, id: id }, state);
            count++;
          });
          console.log("Feature states set for " + count + " features in source '" + sourceId + "'");
        });
      }

      function parseMapHash(hashValue) {
        if (!hashValue) return null;
        const raw = hashValue.charAt(0) === "#" ? hashValue.slice(1) : hashValue;
        const parts = raw.split("/");
        if (parts.length !== 3) return null;

        const zoom = Number(parts[0]);
        const lat = Number(parts[1]);
        const lon = Number(parts[2]);
        const valid = [zoom, lat, lon].every(Number.isFinite)
          && lat >= -90 && lat <= 90
          && lon >= -180 && lon <= 180
          && zoom >= 0 && zoom <= 24;

        if (!valid) return null;
        return { center: [lon, lat], zoom: zoom };
      }

      function formatMapHash(map) {
        const center = map.getCenter();
        const zoom = map.getZoom();
        return zoom.toFixed(2) + "/" + center.lat.toFixed(5) + "/" + center.lng.toFixed(5);
      }

      function updateLocationHash(hashValue) {
        const nextHash = "#" + hashValue;
        if (window.location.hash === nextHash) return;
        const base = window.location.pathname + window.location.search;
        if (window.history && typeof window.history.replaceState === "function") {
          window.history.replaceState(null, "", base + nextHash);
        } else {
          window.location.hash = hashValue;
        }
      }

      function enableMapHashSync(map) {
        if (!map || map._llmapsHashSyncEnabled) return;
        map._llmapsHashSyncEnabled = true;

        const sync = function() {
          updateLocationHash(formatMapHash(map));
        };

        map.on("load", sync);
        map.on("moveend", sync);
      }

      function isHashPositionEnabled(config) {
        if (typeof config.hash_position === "boolean") return config.hash_position;
        const controls = (config.components || []).find(function(c) { return c.type === "controls"; });
        if (controls && typeof controls.hash === "boolean") return controls.hash;
        return false;
      }

      function createSingleMap(containerId, config, layerIdsFilter, embeddedSources, options) {
        const useHash = !!(options && options.hashSync);
        const hashState = useHash ? parseMapHash(window.location.hash) : null;
        const center = (hashState && hashState.center) || config.center || [0, 0];
        const zoom = (hashState && hashState.zoom) ?? (config.zoom ?? 10);
        const tiles = config.tiles || {};
        const styleUrl = (config && config.style_url) || null;

        const mapOptions = {
          container: containerId,
          center: center,
          zoom: zoom,
          attributionControl: false
        };

        // If an explicit external style is provided in the config
        // (e.g. Lightberry from WB Maps), use it directly.
        // Otherwise, build a basic raster style.
        if (styleUrl) {
          mapOptions.style = styleUrl;
        } else {
          mapOptions.style = buildBaseStyle(center, zoom, tiles);
        }

        const map = new maplibregl.Map(mapOptions);

        // Single attribution control: style/sources + custom LLMaps label.
        if (typeof maplibregl.AttributionControl === "function") {
          const customAttr = config.custom_attribution || '© LLMaps';
          map.addControl(new maplibregl.AttributionControl({
            customAttribution: customAttr
          }), "bottom-right");
        }
        if (useHash) enableMapHashSync(map);

        const layers = config.layers || [];
        const embedded = config.embedded_sources || embeddedSources || {};

        map._loadLayers = () => {
          if (map._layersLoading) {
            console.warn('Layers are already loading, skipping duplicate call');
            return Promise.resolve();
          }
          map._layersLoading = true;
          return loadLayers(map, config, embedded, layerIdsFilter).then(() => {
            applyFeatureStates(map, config);
            map._layersLoading = false;
            window._llmapsLayersReady = true;
            window._llmapsReadyMap = map;
            window._llmapsReadyCallbacks.forEach(fn => fn(map));
          }).catch(err => {
            map._layersLoading = false;
            throw err;
          });
        };

        map.on("load", function() {
          map._loadLayers().then(() => {
            map._layersLoaded = true;
          });
        });

        return map;
      }

      /**
       * Safely destroy a map instance and release its WebGL context.
       * Call before removing the map container from DOM when using lazy_init
       * or when evicting due to max_active_maps. Idempotent if map already removed.
       */
      function destroySingleMap(map) {
        if (!map) return;
        try {
          if (typeof map.remove === "function") map.remove();
        } catch (e) {
          if (typeof console !== "undefined" && console.warn) console.warn("LLMaps: destroySingleMap", e);
        }
        map._layersLoaded = false;
        map._layersLoading = false;
        if (window._llmapsReadyMap === map) {
          window._llmapsReadyMap = null;
          window._llmapsLayersReady = false;
        }
        if (window.llmaps_maps && Array.isArray(window.llmaps_maps)) {
          window.llmaps_maps = window.llmaps_maps.filter(function(m) { return m !== map; });
        }
        if (window.llmaps_map === map) window.llmaps_map = null;
      }

      function setupComparison(root, config) {
        const comp = config.comparison;
        const leftIds = comp.left_layers || [];
        const rightIds = comp.right_layers || [];
        root.id = "llmaps-comparison-container";
        root.innerHTML = [
          '<div id="llmaps-compare-before" class="llmaps-compare-map"></div>',
          '<div id="llmaps-compare-after" class="llmaps-compare-map"></div>'
        ].join("");

        const embedded = config.embedded_sources || {};
        const allConfigLayerIds = (config.layers || []).map(function(l) { return l.id; });
        function withOutlineLayers(ids) {
          var result = ids.slice();
          ids.forEach(function(id) {
            if (allConfigLayerIds.indexOf(id + "-outline") !== -1) result.push(id + "-outline");
          });
          return result;
        }
        const hashSyncEnabled = isHashPositionEnabled(config);
        const beforeMap = createSingleMap(
          "llmaps-compare-before",
          config,
          withOutlineLayers(leftIds),
          embedded,
          { hashSync: false }
        );
        const afterMap = createSingleMap(
          "llmaps-compare-after",
          config,
          withOutlineLayers(rightIds),
          embedded,
          { hashSync: false }
        );

        function enableComparisonHashSync(mapLeft, mapRight) {
          if (!hashSyncEnabled) return;

          var isSyncing = false;
          function syncHashFrom(source) {
            if (isSyncing) return;
            isSyncing = true;
            updateLocationHash(formatMapHash(source));
            isSyncing = false;
          }

          var initialHash = parseMapHash(window.location.hash);
          if (initialHash) {
            mapLeft.jumpTo(initialHash);
            mapRight.jumpTo(initialHash);
          } else if (mapLeft && typeof mapLeft.getCenter === "function") {
            updateLocationHash(formatMapHash(mapLeft));
          }

          mapLeft.on("moveend", function() { syncHashFrom(mapLeft); });
          mapRight.on("moveend", function() { syncHashFrom(mapRight); });

          window.addEventListener("hashchange", function() {
            var hashState = parseMapHash(window.location.hash);
            if (!hashState || isSyncing) return;
            isSyncing = true;
            mapLeft.jumpTo(hashState);
            mapRight.jumpTo(hashState);
            isSyncing = false;
          });
        }

        if (typeof maplibregl.Compare !== "function") {
          console.warn("maplibre-gl-compare not loaded; comparison uses basic sync only.");
          beforeMap.on("moveend", function() {
            afterMap.setCenter(beforeMap.getCenter());
            afterMap.setZoom(beforeMap.getZoom());
          });
          afterMap.on("moveend", function() {
            beforeMap.setCenter(afterMap.getCenter());
            beforeMap.setZoom(afterMap.getZoom());
          });
          enableComparisonHashSync(beforeMap, afterMap);
          return { mapLeft: beforeMap, mapRight: afterMap };
        }

        var compare = new maplibregl.Compare(beforeMap, afterMap, "#llmaps-comparison-container", {
          mousemove: false,
          orientation: "vertical"
        });

        enableComparisonHashSync(beforeMap, afterMap);
        return { mapLeft: beforeMap, mapRight: afterMap };
      }

      function addComponents(config, mapOrMaps) {
        const maps = Array.isArray(mapOrMaps) ? mapOrMaps : [mapOrMaps];
        const map = maps[0];
        const components = config.components || [];

        // Get locale from config, default to en-US
        const locale = config.locale || "en-US";
        const normalizedLocale = String(locale).replace(/_/g, "-");

        function formatValue(val, fieldName) {
          if (val == null) return "";

          // Special case: year field - never format with thousand separators
          if (fieldName === 'year' && typeof val === 'number') {
            return String(Math.round(val));
          }

          // If value is a number, format with locale-aware separators
          if (typeof val === 'number') {
            return val.toLocaleString(locale, {
              maximumFractionDigits: 2
            });
          }

          // If value is a string that looks like a number, parse and format it
          if (typeof val === 'string') {
            const trimmed = val.trim();
            const parsed = Number(trimmed);

            // Ensure parsing succeeded and the string is not empty
            if (!isNaN(parsed) && trimmed !== '' && /^-?\d+\.?\d*$/.test(trimmed)) {
              // Check if it's a year field or year-like value (4-digit integer 1900-2100)
              if (fieldName === 'year' || (Number.isInteger(parsed) && parsed >= 1900 && parsed <= 2100 && trimmed.length === 4)) {
                return String(Math.round(parsed));
              }
              return parsed.toLocaleString(locale, {
                maximumFractionDigits: 2
              });
            }
          }

          // Otherwise return as string
          return String(val);
        }
        components.forEach(c => {
          if (c.type === "controls") {
            if (c.zoom)
              map.addControl(new maplibregl.NavigationControl(), "top-left");
            if (c.scale && typeof maplibregl.ScaleControl === "function")
              map.addControl(new maplibregl.ScaleControl(), "bottom-left");
            if (c.fullscreen && maplibregl.FullscreenControl)
              map.addControl(new maplibregl.FullscreenControl(), "top-left");
          }
        });

        const basemapSwitcherConfig = components.find(c => c.type === "basemap_switcher");
        const hasTileProviders = config.tile_providers && config.tile_providers.length > 0;

        function tileUrl(tiles) {
          const t = (tiles && tiles.url_template) || "";
          return t.replace("{s}", (tiles.subdomains && tiles.subdomains[0]) || "a");
        }
        
        // Make switchBasemap available globally for server-rendered legend
        window.llmaps_switchBasemap = function(providerId) {
          const provider = config.tile_providers.find(function(p) { return p.id === providerId; });
          if (!provider) return;
          const url = tileUrl(provider);
          maps.forEach(function(m) {
            if (!m.getLayer || !m.getSource) return;
            if (m.getLayer("llmaps-base")) m.removeLayer("llmaps-base");
            if (m.getSource("llmaps-base")) m.removeSource("llmaps-base");
            m.addSource("llmaps-base", {
              type: "raster",
              tiles: [url],
              tileSize: 256,
              attribution: provider.attribution || ""
            });
            const layers = m.getStyle().layers;
            const firstId = layers && layers[0] ? layers[0].id : undefined;
            m.addLayer({ id: "llmaps-base", type: "raster", source: "llmaps-base" }, firstId);
          });
        };
        
        function createBasemapSelect(config, maps, currentId) {
          const wrap = document.createElement("div");
          wrap.className = "llmaps-basemap-select-wrap";
          const select = document.createElement("select");
          select.className = "llmaps-basemap-select";
          config.tile_providers.forEach(function(provider) {
            const opt = document.createElement("option");
            opt.value = provider.id;
            opt.textContent = provider.name || provider.id;
            if (provider.id === currentId) opt.selected = true;
            select.appendChild(opt);
          });
          select.addEventListener("change", function() {
            window.llmaps_switchBasemap(select.value);
          });
          wrap.appendChild(select);
          return wrap;
        }

        // Legend is now server-rendered, skip client-side generation

        // Standalone basemap switcher (if not embedded in legend)
        const legendConfig = components.find(c => c.type === "legend");
        const basemapInLegend = legendConfig && hasTileProviders;

        if (basemapSwitcherConfig && hasTileProviders && !basemapInLegend) {
          const currentTiles = config.tiles || {};
          const currentId = currentTiles.id || (config.tile_providers[0] && config.tile_providers[0].id);
          const wrap = document.createElement("div");
          wrap.className = "llmaps-basemap-switcher " + (basemapSwitcherConfig.position || "top-left");
          wrap.style.position = "absolute";
          wrap.style.zIndex = "10";
          wrap.appendChild(createBasemapSelect(config, maps, currentId));
          document.body.appendChild(wrap);
        }

        const popupConfig = components.find(c => c.type === "popup");
        if (popupConfig && typeof maplibregl.Popup === "function") {
          const defaultFields = popupConfig.fields || [];
          const fieldLabels = popupConfig.field_labels || {};
          const fieldsByLayer = popupConfig.fields_by_layer || {};
          const popupTrigger = popupConfig.trigger || "click";
          const layers = config.layers || [];

          // Layers with sidebar: skip click popup (click opens sidebar), but allow hover popup
          const _sidebarCfg = components.find(c => c.type === "sidebar");
          const sidebarLayerIds = _sidebarCfg && _sidebarCfg.fields_by_layer
            ? new Set(Object.keys(_sidebarCfg.fields_by_layer)) : new Set();

          function popupContent(feature, layerId) {
            const fields = fieldsByLayer[layerId] && fieldsByLayer[layerId].length
              ? fieldsByLayer[layerId] : defaultFields;
            const props = feature.properties || {};
            if (!fields.length) return Object.keys(props).length ? JSON.stringify(props) : "";
            const rows = fields.map(f => {
              const label = fieldLabels[f] || f;
              const val = props[f];
              return "<tr><td>" + label + "</td><td>" + formatValue(val, f) + "</td></tr>";
            });
            return "<table style=\"font-size:12px;\">" + rows.join("") + "</table>";
          }

          function lngLat(feature) {
            const g = feature.geometry;
            if (!g || !g.coordinates) return null;
            const c = g.coordinates;
            if (g.type === "Point") return c;
            if (g.type === "LineString" || g.type === "MultiPoint") return c[0];
            if (g.type === "Polygon") return c[0][0];
            if (g.type === "MultiLineString") return c[0][0];
            if (g.type === "MultiPolygon") return c[0][0][0];
            if (c[0] != null && typeof c[0] === "number") return c;
            if (Array.isArray(c[0]) && c[0].length >= 2 && typeof c[0][0] === "number") return c[0];
            return null;
          }

          function addPopupToMap(m) {
            if (!m || !m.getLayer) return;

            const hasFieldsByLayer = Object.keys(fieldsByLayer).length > 0;
            if (popupTrigger === "hover") {
              var hoverPopup = new maplibregl.Popup({ closeButton: false, closeOnClick: false });
              layers.forEach(layerCfg => {
                const layerId = layerCfg.id;
                if (!m.getLayer(layerId)) return;
                if (hasFieldsByLayer && !fieldsByLayer[layerId]) return;
                m.on("mousemove", layerId, function(ev) {
                  const feat = ev.features && ev.features[0];
                  if (!feat) return;
                  var html = popupContent(feat, layerId);
                  if (!html) return;
                  m.getCanvas().style.cursor = "pointer";
                  hoverPopup.setLngLat(ev.lngLat).setHTML(html).addTo(m);
                });
                m.on("mouseleave", layerId, function() {
                  m.getCanvas().style.cursor = "";
                  hoverPopup.remove();
                });
              });
            } else {
              // Single map click + queryRenderedFeatures + layer type priority (points over polygons)
              // When fields_by_layer is set, only layers listed there get popup (e.g. no popup on point layer)
              const popupLayerIds = layers
                .filter(function(l) {
                  if (sidebarLayerIds.has(l.id) || !m.getLayer(l.id)) return false;
                  if (hasFieldsByLayer && !fieldsByLayer[l.id]) return false;
                  return true;
                })
                .map(function(l) { return l.id; });
              const typePriority = { circle: 0, symbol: 1, line: 2, fill: 3 };
              var currentPopup = null;
              var selectedFeature = null;
              var _prevHl = null; // { map, source, id }
              function _hlClear() {
                if (_prevHl) {
                  _prevHl.map.removeFeatureState({ source: _prevHl.source, id: _prevHl.id }, 'selected');
                  _prevHl = null;
                }
              }
              function _hlEnsureLayer(m, sourceId, parentLayerType, sourceLayer) {
                var hlId = 'llmaps-hl-' + sourceId;
                if (m.getLayer(hlId)) return;
                var isPoint = parentLayerType === 'circle' || parentLayerType === 'symbol';
                var sel = ['boolean', ['feature-state', 'selected'], false];
                var spec = isPoint
                  ? { id: hlId, type: 'circle', source: sourceId,
                      paint: { 'circle-radius': ['case', sel, 10, 0],
                               'circle-color': 'transparent',
                               'circle-stroke-color': '#111111',
                               'circle-stroke-width': ['case', sel, 2.5, 0] } }
                  : { id: hlId, type: 'line', source: sourceId,
                      paint: { 'line-color': '#111111',
                               'line-width': ['case', sel, 3.5, 0] } };
                if (sourceLayer) spec['source-layer'] = sourceLayer;
                m.addLayer(spec);
              }
              function _hlSet(m, feat) {
                _hlClear();
                if (!feat || feat.id == null) return;
                var sourceId = feat.source;
                _hlEnsureLayer(m, sourceId, feat.layer && feat.layer.type, feat.sourceLayer);
                m.setFeatureState({ source: sourceId, id: feat.id }, { selected: true });
                _prevHl = { map: m, source: sourceId, id: feat.id };
              }
              m.on("click", function(ev) {
                if (currentPopup) {
                  currentPopup.remove();
                  currentPopup = null;
                }
                _hlSet(m, null);
                selectedFeature = null;
                if (!popupLayerIds.length) return;
                var features = m.queryRenderedFeatures(ev.point, { layers: popupLayerIds });
                if (!features.length) return;
                features.sort(function(a, b) {
                  var typeA = (m.getLayer(a.layer.id) && m.getLayer(a.layer.id).type) || "fill";
                  var typeB = (m.getLayer(b.layer.id) && m.getLayer(b.layer.id).type) || "fill";
                  return (typePriority[typeA] !== undefined ? typePriority[typeA] : 99) - (typePriority[typeB] !== undefined ? typePriority[typeB] : 99);
                });
                var feat = features[0];
                var layerId = feat.layer.id;
                _hlSet(m, feat);
                selectedFeature = feat;
                currentPopup = new maplibregl.Popup()
                  .setLngLat(ev.lngLat)
                  .setHTML(popupContent(feat, layerId))
                  .addTo(m);
                // Clear highlight when popup is closed manually
                currentPopup.on('close', function() {
                  _hlClear();
                  currentPopup = null;
                  selectedFeature = null;
                });
              });
              m.getCanvas().style.cursor = "pointer";
            }
          }

          window.llmapsOnLayersReady(function(m) {
            addPopupToMap(m);
          });
          
          // Export for external map instances (e.g., comparison maps created via custom JS)
          window.llmapsAddPopupToMap = addPopupToMap;
        }

        // Sidebar
        const sidebarConfig = components.find(c => c.type === "sidebar");
        if (sidebarConfig) {
          const sbWidth = sidebarConfig.width || 400;
          const sbPosition = sidebarConfig.position || "right";
          const sbFieldsByLayer = sidebarConfig.fields_by_layer || {};
          const sbFieldLabels = sidebarConfig.field_labels || {};
          const sbTitleField = sidebarConfig.title_field || null;
          const sbTitleByLayer = sidebarConfig.title_by_layer || {};
          const sbCloseOnMapClick = sidebarConfig.close_on_map_click !== false;
          const sbZoomOnClick = sidebarConfig.zoom_on_click;
          const sbHideEmptyFields = sidebarConfig.hide_empty_fields !== false;
          const layers = config.layers || [];

          // Create sidebar DOM
          const sbEl = document.createElement("div");
          sbEl.id = "llmaps-sidebar";
          sbEl.className = "llmaps-sidebar " + sbPosition;
          sbEl.style.setProperty("--llmaps-sidebar-width", sbWidth + "px");
          document.body.appendChild(sbEl);

          var sbIgnoreNextMapClick = false;

          function sidebarOpen(layerId, feature) {
            const props = feature.properties || {};
            const fields = sbFieldsByLayer[layerId] || Object.keys(props);
            const title = (sbTitleField && props[sbTitleField])
              ? String(props[sbTitleField])
              : (sbTitleByLayer[layerId] || "Feature info");

            let html = '<div class="llmaps-sidebar-header">'
              + '<h2 class="llmaps-sidebar-title">' + _sbEsc(title) + '</h2>'
              + '<button class="llmaps-sidebar-close" title="Close">&times;</button>'
              + '</div>'
              + '<div class="llmaps-sidebar-content"><div class="llmaps-sidebar-section">';

            fields.forEach(function(f) {
              const label = sbFieldLabels[f] || f;
              const val = props[f];
              // Skip empty/null/whitespace-only values if enabled
              if (sbHideEmptyFields) {
                if (val == null) return;
                if (typeof val === "string" && val.trim() === "") return;
              }
              var linkHtml = _sbLinkField(f, val);
              var valueHtml = linkHtml !== false ? linkHtml : _sbEsc(formatValue(val, f));
              html += '<div class="llmaps-sidebar-field">'
                + '<span class="llmaps-sidebar-field-label">' + _sbEsc(label) + '</span>'
                + '<span class="llmaps-sidebar-field-value">' + valueHtml + '</span>'
                + '</div>';
            });

            html += '</div></div>';
            sbEl.innerHTML = html;
            sbEl.classList.add("open");

            sbEl.querySelector(".llmaps-sidebar-close").addEventListener("click", sidebarClose);
          }

          function sidebarClose() {
            sbEl.classList.remove("open");
          }

          function _sbEsc(str) {
            var d = document.createElement("div");
            d.textContent = str;
            return d.innerHTML;
          }

          function _sbLinkField(fieldName, val) {
            if (val == null || typeof val !== "string") return false;
            var v = val.trim();
            if (v.indexOf("http://") !== 0 && v.indexOf("https://") !== 0) return false;
            if (fieldName !== "url" && fieldName !== "detail") return false;
            var d = document.createElement("div");
            d.textContent = v;
            var escaped = d.innerHTML;
            var href = v.replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/'/g, "&#39;").replace(/</g, "&lt;");
            return '<a href="' + href + '" target="_blank" rel="noopener noreferrer">' + escaped + '</a>';
          }

          // Expose API globally
          window.llmapsSidebarOpen = sidebarOpen;
          window.llmapsSidebarClose = sidebarClose;

          // Register click handlers
          window.llmapsOnLayersReady(function(m) {
            var layerIds = Object.keys(sbFieldsByLayer);
            if (!layerIds.length) {
              layerIds = layers.map(function(l) { return l.id; });
            }
            layerIds.forEach(function(layerId) {
              if (!m.getLayer(layerId)) return;
              m.on("click", layerId, function(ev) {
                var feat = ev.features && ev.features[0];
                if (!feat) {
                  if (ev.features && ev.features.length === 0 && console && typeof console.warn === "function")
                    console.warn("LLMaps sidebar: click on layer " + layerId + " returned no features");
                  return;
                }
                if (ev.originalEvent) ev.originalEvent.stopPropagation();
                if (typeof ev.preventDefault === "function") ev.preventDefault();
                sbIgnoreNextMapClick = true;
                sidebarOpen(layerId, feat);
                if (sbZoomOnClick != null) {
                  var g = feat.geometry;
                  if (g && g.type === "Point" && g.coordinates) {
                    m.flyTo({ center: g.coordinates, zoom: sbZoomOnClick, duration: 1500 });
                  }
                }
              });
            });

            if (sbCloseOnMapClick) {
              m.on("click", function(ev) {
                if (sbIgnoreNextMapClick) {
                  sbIgnoreNextMapClick = false;
                  return;
                }
                if (!ev.defaultPrevented) sidebarClose();
              });
            }
          });
        }

        // Dashboard
        const dashboardConfig = components.find(c => c.type === "dashboard");
        if (dashboardConfig) {
          const dashboardId = dashboardConfig.dashboard_id || "dashboard";
          const dashboardPosition = dashboardConfig.position || "top-right";
          const dashboardTitle = dashboardConfig.title || "Dashboard";
          const dashboardWidth = dashboardConfig.width || 360;
          const dashboardHeight = dashboardConfig.height;
          const dashboardCollapsible = dashboardConfig.collapsible !== false;
          const dashboardFilters = Array.isArray(dashboardConfig.filters) ? dashboardConfig.filters : [];
          const dashboardEmptyState = dashboardConfig.empty_state || "No dashboard content yet.";
          const dashboardEl = document.createElement("section");
          const dashboardHeader = document.createElement("div");
          const dashboardTitleEl = document.createElement("h2");
          const dashboardBody = document.createElement("div");
          const dashboardFilterBar = document.createElement("div");
          const dashboardContent = document.createElement("div");
          let dashboardToggleBtn = null;
          const dashboardState = {};

          dashboardEl.className = "llmaps-dashboard " + dashboardPosition;
          dashboardEl.setAttribute("data-dashboard-id", dashboardId);
          dashboardEl.style.setProperty("--llmaps-dashboard-width", dashboardWidth + "px");
          if (dashboardHeight != null) {
            dashboardEl.style.setProperty("--llmaps-dashboard-height", dashboardHeight + "px");
          }

          dashboardHeader.className = "llmaps-dashboard-header";
          dashboardTitleEl.className = "llmaps-dashboard-title";
          dashboardTitleEl.textContent = dashboardTitle;
          dashboardHeader.appendChild(dashboardTitleEl);

          if (dashboardCollapsible) {
            dashboardToggleBtn = document.createElement("button");
            dashboardToggleBtn.type = "button";
            dashboardToggleBtn.className = "llmaps-dashboard-toggle";
            dashboardToggleBtn.setAttribute("aria-label", "Toggle dashboard");
            dashboardHeader.appendChild(dashboardToggleBtn);
          }

          dashboardBody.className = "llmaps-dashboard-body";
          dashboardFilterBar.className = "llmaps-dashboard-filters";
          dashboardContent.className = "llmaps-dashboard-content";
          dashboardBody.appendChild(dashboardFilterBar);
          dashboardBody.appendChild(dashboardContent);
          dashboardEl.appendChild(dashboardHeader);
          dashboardEl.appendChild(dashboardBody);

          function dashboardSetContent(html) {
            dashboardContent.innerHTML = "";
            if (html && String(html).trim() !== "") {
              dashboardContent.innerHTML = html;
              dashboardContent.classList.remove("is-empty");
              return;
            }
            dashboardContent.classList.add("is-empty");
            const emptyEl = document.createElement("div");
            emptyEl.className = "llmaps-dashboard-empty";
            emptyEl.textContent = dashboardEmptyState;
            dashboardContent.appendChild(emptyEl);
          }

          function dashboardDispatch(filterId, value) {
            window.dispatchEvent(new CustomEvent("llmaps:dashboard-filter-change", {
              detail: {
                dashboardId: dashboardId,
                filterId: filterId,
                value: value,
                state: Object.assign({}, dashboardState),
              }
            }));
          }

          function dashboardNormalizeOptions(options) {
            if (!Array.isArray(options)) return [];
            return options.map(function(option) {
              if (option && typeof option === "object" && option.value !== undefined) {
                return {
                  value: String(option.value),
                  label: String(option.label != null ? option.label : option.value),
                };
              }
              return { value: String(option), label: String(option) };
            });
          }

          function dashboardResolveDateLocale() {
            if (!window.flatpickr) return "default";
            if (normalizedLocale.toLowerCase().indexOf("ru") === 0) {
              return (window.flatpickr.l10ns && window.flatpickr.l10ns.ru) || "ru";
            }
            return "default";
          }

          function dashboardCreateFilter(filterConfig, index) {
            const filterId = filterConfig.id || ("filter-" + index);
            const filterType = filterConfig.type || "select";
            const filterWrap = document.createElement("label");
            const filterLabel = document.createElement("span");
            let input;
            let emitEventName = filterType === "text" ? "input" : "change";

            filterWrap.className = "llmaps-dashboard-filter";
            filterWrap.setAttribute("data-filter-id", filterId);
            filterLabel.className = "llmaps-dashboard-filter-label";
            filterLabel.textContent = filterConfig.label || filterId;
            filterWrap.appendChild(filterLabel);

            if (filterType === "select") {
              input = document.createElement("select");
              dashboardNormalizeOptions(filterConfig.options).forEach(function(option) {
                const optionEl = document.createElement("option");
                optionEl.value = option.value;
                optionEl.textContent = option.label;
                input.appendChild(optionEl);
              });
            } else {
              input = document.createElement("input");
              input.type = "text";
              if (filterConfig.placeholder) input.placeholder = filterConfig.placeholder;
            }

            input.className = "llmaps-dashboard-filter-input";
            input.setAttribute("lang", normalizedLocale);
            if (filterConfig.value != null) input.value = String(filterConfig.value);
            dashboardState[filterId] = input.value;

            if (filterType === "date" && window.flatpickr) {
              window.flatpickr(input, {
                dateFormat: "Y-m-d",
                defaultDate: filterConfig.value != null ? String(filterConfig.value) : null,
                allowInput: true,
                disableMobile: true,
                locale: dashboardResolveDateLocale(),
                onChange: function(selectedDates, dateStr) {
                  dashboardState[filterId] = dateStr;
                  dashboardDispatch(filterId, dateStr);
                },
              });
              input.addEventListener("input", function() {
                dashboardState[filterId] = input.value;
              });
            } else {
              input.addEventListener(emitEventName, function() {
                dashboardState[filterId] = input.value;
                dashboardDispatch(filterId, input.value);
              });
            }

            filterWrap.appendChild(input);
            dashboardFilterBar.appendChild(filterWrap);
          }

          function dashboardSetCollapsed(collapsed) {
            dashboardEl.classList.toggle("collapsed", !!collapsed);
            if (dashboardToggleBtn) {
              dashboardToggleBtn.textContent = collapsed ? "+" : "-";
              dashboardToggleBtn.setAttribute("aria-expanded", collapsed ? "false" : "true");
            }
          }

          dashboardFilters.forEach(dashboardCreateFilter);
          if (!dashboardFilters.length) {
            dashboardFilterBar.style.display = "none";
          }

          if (dashboardToggleBtn) {
            dashboardToggleBtn.addEventListener("click", function() {
              dashboardSetCollapsed(!dashboardEl.classList.contains("collapsed"));
            });
          }

          if (!window.llmapsDashboards) window.llmapsDashboards = {};
          window.llmapsDashboards[dashboardId] = {
            element: dashboardEl,
            state: dashboardState,
            setContent: dashboardSetContent,
            setTitle: function(title) { dashboardTitleEl.textContent = title; },
            setCollapsed: dashboardSetCollapsed,
          };
          window.llmapsDashboardSetContent = function(id, html) {
            var dashboard = window.llmapsDashboards && window.llmapsDashboards[id];
            if (dashboard) dashboard.setContent(html);
          };
          window.llmapsDashboardSetTitle = function(id, title) {
            var dashboard = window.llmapsDashboards && window.llmapsDashboards[id];
            if (dashboard) dashboard.setTitle(title);
          };
          window.llmapsDashboardGetState = function(id) {
            var dashboard = window.llmapsDashboards && window.llmapsDashboards[id];
            return dashboard ? Object.assign({}, dashboard.state) : null;
          };
          window.llmapsDashboardSetCollapsed = function(id, collapsed) {
            var dashboard = window.llmapsDashboards && window.llmapsDashboards[id];
            if (dashboard) dashboard.setCollapsed(collapsed);
          };

          map.getContainer().appendChild(dashboardEl);
          dashboardSetContent(dashboardConfig.content_html || "");
          dashboardSetCollapsed(!!dashboardConfig.collapsed);
        }

        // FeatureSearch — search within map data attributes
        const featureSearchConfig = components.find(c => c.type === "feature_search");
        if (featureSearchConfig) {
          const fsPosition = featureSearchConfig.position || "top-center";
          const fsPlaceholder = featureSearchConfig.placeholder || "Search...";
          const fsSearchFields = featureSearchConfig.search_fields || {};
          const fsFieldLabels = featureSearchConfig.field_labels || {};
          const fsMaxResults = featureSearchConfig.max_results || 15;
          const fsZoom = featureSearchConfig.zoom_on_select || 8;
          const fsDebounce = featureSearchConfig.debounce_ms || 200;
          const fsMinChars = featureSearchConfig.min_chars || 2;

          // Build DOM
          const fsWrap = document.createElement("div");
          fsWrap.className = "llmaps-feature-search " + fsPosition;
          const fsInput = document.createElement("input");
          fsInput.type = "text";
          fsInput.placeholder = fsPlaceholder;
          fsInput.autocomplete = "off";
          fsInput.className = "llmaps-feature-search-input";
          fsWrap.appendChild(fsInput);
          const fsDropdown = document.createElement("div");
          fsDropdown.className = "llmaps-feature-search-dropdown";
          fsWrap.appendChild(fsDropdown);
          map.getContainer().appendChild(fsWrap);

          // Cache source data for searching
          var _fsCache = {};

          function fsBuildCache() {
            var sourceIds = Object.keys(fsSearchFields);
            sourceIds.forEach(function(sourceId) {
              if (_fsCache[sourceId]) return;
              if (typeof window.llmapsGetSourceData === "function") {
                window.llmapsGetSourceData(sourceId).then(function(geojson) {
                  if (geojson && geojson.features) {
                    _fsCache[sourceId] = geojson.features;
                  }
                });
              }
            });
          }

          function fsSearch(query) {
            var results = [];
            var qLower = query.toLowerCase();
            var sourceIds = Object.keys(fsSearchFields);

            for (var si = 0; si < sourceIds.length; si++) {
              if (results.length >= fsMaxResults) break;
              var sourceId = sourceIds[si];
              var fields = fsSearchFields[sourceId] || [];
              var features = _fsCache[sourceId] || [];

              for (var fi = 0; fi < features.length; fi++) {
                if (results.length >= fsMaxResults) break;
                var feat = features[fi];
                var props = feat.properties || {};

                for (var ki = 0; ki < fields.length; ki++) {
                  var fieldName = fields[ki];
                  var val = props[fieldName];
                  if (val == null) continue;
                  if (String(val).toLowerCase().includes(qLower)) {
                    var label = String(val);
                    var secondary = "";
                    for (var xi = 0; xi < fields.length; xi++) {
                      if (xi === ki) continue;
                      var sv = props[fields[xi]];
                      if (sv != null) { secondary = String(sv); break; }
                    }
                    results.push({
                      sourceId: sourceId,
                      feature: feat,
                      label: label,
                      secondary: secondary,
                      fieldLabel: fsFieldLabels[fieldName] || fieldName,
                    });
                    break;
                  }
                }
              }
            }
            return results;
          }

          function fsRenderResults(results) {
            fsDropdown.innerHTML = "";
            if (results.length === 0) {
              fsDropdown.innerHTML = '<div class="llmaps-feature-search-empty">No results</div>';
              fsDropdown.classList.add("visible");
              return;
            }
            results.forEach(function(r) {
              var div = document.createElement("div");
              div.className = "llmaps-feature-search-item";
              var text = r.label;
              if (r.secondary) text += " \u2014 " + r.secondary;
              div.textContent = text;
              var badge = document.createElement("span");
              badge.className = "llmaps-feature-search-item-source";
              badge.textContent = r.fieldLabel;
              div.appendChild(badge);
              div.addEventListener("click", function() {
                fsDropdown.classList.remove("visible");
                fsInput.value = "";
                fsFlyToFeature(r.feature);
                if (typeof window.llmapsSidebarOpen === "function") {
                  var layerCfg = (config.layers || []).find(function(l) { return l.source === r.sourceId; });
                  if (layerCfg) window.llmapsSidebarOpen(layerCfg.id, r.feature);
                }
              });
              fsDropdown.appendChild(div);
            });
            fsDropdown.classList.add("visible");
          }

          function fsFlyToFeature(feature) {
            var g = feature.geometry;
            if (!g) return;
            if (g.type === "Point" && g.coordinates) {
              maps.forEach(function(m) {
                m.flyTo({ center: g.coordinates, zoom: fsZoom, duration: 1500 });
              });
            } else {
              var bounds = new maplibregl.LngLatBounds();
              _fsForEachCoord(g, function(c) { bounds.extend(c); });
              if (!bounds.isEmpty()) {
                maps.forEach(function(m) {
                  m.fitBounds(bounds, { padding: 50, maxZoom: fsZoom });
                });
              }
            }
          }

          function _fsForEachCoord(geometry, fn) {
            if (geometry.type === "Point") { fn(geometry.coordinates); return; }
            if (geometry.type === "MultiPoint") { geometry.coordinates.forEach(fn); return; }
            if (geometry.type === "LineString") { geometry.coordinates.forEach(fn); return; }
            if (geometry.type === "Polygon") { geometry.coordinates[0].forEach(fn); return; }
            if (geometry.type === "MultiPolygon") {
              geometry.coordinates.forEach(function(poly) { poly[0].forEach(fn); });
              return;
            }
            if (geometry.type === "MultiLineString") {
              geometry.coordinates.forEach(function(line) { line.forEach(fn); });
            }
          }

          var fsTimer;
          fsInput.addEventListener("input", function() {
            clearTimeout(fsTimer);
            var q = fsInput.value.trim();
            if (q.length < fsMinChars) { fsDropdown.classList.remove("visible"); return; }
            fsTimer = setTimeout(function() { fsRenderResults(fsSearch(q)); }, fsDebounce);
          });
          fsInput.addEventListener("keydown", function(e) {
            if (e.key === "Enter") {
              e.preventDefault();
              var firstItem = fsDropdown.querySelector(".llmaps-feature-search-item");
              if (firstItem) firstItem.click();
            }

      window._llmapsLifecycle = {

        const visibilityIds = MAP_CONFIG.visibility_optimization_source_ids || [];

        function disposeCurrent() {

          if (!entry) return;
          if (typeof entry.dispose === "function") entry.dispose();

        }

        function ensureMap() {

            entry.dispose = function() {

              entry.maps = null;

          if (rect.top < (window.innerHeight || document.documentElement.clientHeight) && rect.bottom > 0) ensureMap();
        }
      }

      function createMap() {
        const MAP_CONFIG = readConfig();
        const root = document.getElementById("map-root");
        if (!root) return;

        const visibilityIds = MAP_CONFIG.visibility_optimization_source_ids || [];

        if (MAP_CONFIG.comparison && MAP_CONFIG.comparison.left_layers && MAP_CONFIG.comparison.right_layers) {
          const { mapLeft, mapRight } = setupComparison(root, MAP_CONFIG);

      }

      function initMap() {
        const MAP_CONFIG = readConfig();
        var instanceCount = Math.max(1, MAP_CONFIG.map_instance_count || 1);
        var useLifecycle = MAP_CONFIG.lazy_init && instanceCount >= 3 && typeof initLifecycleWithObserver === "function";
        if (useLifecycle) {

          var visibilityIds = MAP_CONFIG.visibility_optimization_source_ids || [];
          if (visibilityIds.length && typeof initVisibilityOptimization === "function")

            toggles.forEach(function(checkbox) {
                checkbox.addEventListener('change', function() {

    <script>/* Ring overlay: circle area ~ population, arc length ~ lighting %. */
(function () {
  const POP_MAX = window.llmapsData?.meta?.pop_max ?? 1;
  const R_MIN = 6;
  const R_MAX = 58;
  const AREA_SCALE = 5; // площадь круга / 5 => радиус / sqrt(5)
  const R_SCALE = 1 / Math.sqrt(AREA_SCALE);
  const RING_COLOR = "#FFCC08";
  const RING_GLOW = "rgba(255, 204, 8, 0.85)";

  function popRadius(pop) {
    const p = Math.max(0, Number(pop) || 0);
    if (p <= 0) return R_MIN * R_SCALE;
    const t = Math.sqrt(p / POP_MAX);
    return (R_MIN + t * (R_MAX - R_MIN)) * R_SCALE;
  }

  function drawRing(ctx, x, y, radius, pct) {
    const track = "rgba(255, 204, 8, 0.12)";
    const lineW = Math.max(1.2, radius * 0.085);
    const start = -Math.PI / 2;
    const sweep = (Math.max(0, Math.min(100, pct)) / 100) * Math.PI * 2;

    ctx.save();
    ctx.lineCap = "round";

    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255, 204, 8, 0.05)";
    ctx.fill();

    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.strokeStyle = track;
    ctx.lineWidth = lineW;
    ctx.stroke();

    if (sweep > 0.001) {
      ctx.shadowColor = RING_GLOW;
      ctx.shadowBlur = Math.max(10, radius * 0.45);
      ctx.beginPath();
      ctx.arc(x, y, radius, start, start + sweep);
      ctx.strokeStyle = RING_COLOR;
      ctx.lineWidth = lineW;
      ctx.stroke();

      ctx.shadowBlur = Math.max(16, radius * 0.65);
      ctx.globalAlpha = 0.55;
      ctx.beginPath();
      ctx.arc(x, y, radius, start, start + sweep);
      ctx.strokeStyle = RING_COLOR;
      ctx.lineWidth = lineW * 2;
      ctx.stroke();
    }

    ctx.restore();
  }

  function mountCanvas(map) {
    const host =
      document.getElementById("krasnodar-ring-host") ||
      document.getElementById("map-root");
    if (!host || host.querySelector(".krasnodar-ring-canvas")) return;

    const canvas = document.createElement("canvas");
    canvas.className = "krasnodar-ring-canvas";
    canvas.setAttribute("aria-hidden", "true");
    host.appendChild(canvas);

    const ctx = canvas.getContext("2d");
    let raf = 0;

    function sizeTarget() {
      const root = document.getElementById("map-root");
      return root || host;
    }

    function resize() {
      const box = sizeTarget();
      const w = box.clientWidth;
      const h = box.clientHeight;
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      canvas.style.width = w + "px";
      canvas.style.height = h + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function render() {
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(() => {
        const box = sizeTarget();
        const w = box.clientWidth;
        const h = box.clientHeight;
        ctx.clearRect(0, 0, w, h);
        const feats = window.llmapsData?.points?.features;
        if (!feats) return;
        for (let i = 0; i < feats.length; i++) {
          const f = feats[i];
          const c = f.geometry.coordinates;
          const p = map.project([c[0], c[1]]);
          if (p.x < -100 || p.y < -100 || p.x > w + 100 || p.y > h + 100) continue;
          const props = f.properties || {};
          const r = popRadius(props.pop);
          drawRing(ctx, p.x, p.y, r, props.light_pct ?? 0);
        }
      });
    }

    resize();
    render();
    map.on("move", render);
    map.on("zoom", render);
    map.on("resize", () => {
      resize();
      render();
    });
    map.on("load", render);
    map.on("idle", render);
    window.addEventListener("resize", () => {
      resize();
      render();
    });
  }

  function boot(map) {
    if (!map) return;
    mountCanvas(map);
  }

  function tryBoot() {
    const map = window.llmaps_map || window._llmapsReadyMap;
    if (map) {
      boot(map);
      return true;
    }
    return false;
  }

  if (typeof window.llmapsOnLayersReady === "function") {
    window.llmapsOnLayersReady(boot);
  }

  if (!tryBoot()) {
    const poll = window.setInterval(() => {
      if (tryBoot()) window.clearInterval(poll);
    }, 150);
    window.setTimeout(() => window.clearInterval(poll), 20000);
  }
})();
